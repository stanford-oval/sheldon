# exp076 (sheldon hd-7, session) with the implementor swapped: the local
# loops run on the toolloop engine, on luna, instead of codex under luna.
#
#   sheldon run -c configs/experiments/077_skydiscover_llm_sql_sheldon_toolloop.yaml
#
# Same model for the implementor as the codex arm, so the engine is the only
# axis that moves. Two things differ by construction: codex brings its own
# shell and file tools and has no step ceiling, while toolloop is offered only
# the run's probes (run_shell, evaluate_program) and `candidate_analysis_probe_calls` of
# them per iteration; and toolloop's calls are billed at luna's own prices by
# the LLM layer, while codex is billed at terra's rates as a common unit -- so
# compare the arms on tokens and score, not on dollars.
extends: ../default.yaml

benchmark: skydiscover
split: adrs
method: sheldon
engine: toolloop
model: gpt-5.6-terra

max_rounds: null
max_calls: null
max_usd: 10
concurrency: 1
tag: exp077
notes: >-
  llm_sql, sheldon hd-7 mode=session: terra decides, toolloop (luna) builds
  and evaluates locally, 20 probe calls per local iteration. exp076's arm with
  the implementor engine swapped; $10, at most 3 evaluations at once.

params:
  mode: session
  rounds: 8
  n_initial: 5
  select_k: 5
  candidate_analysis_max_evals: 3
  candidate_analysis_min_gain_pct: 0.5
  candidate_analysis_patience: 2
  set_aside_cooldown: 3
  stagnation_rounds: 2
  candidate_analysis_concurrent: true
  candidate_analysis_probe_calls: 20
  probes: [run_shell]
  candidate_analysis_engine: toolloop
  candidate_analysis_engine_params:
    model: gpt-5.6-luna
  benchmark_opts:
    tasks: ADRS.llm_sql
    isolate: true
    runtime: host
    sandbox_python: /path/to/sheldon/.venv   # absolute path to this checkout's virtualenv
    eval_timeout: 900
    show_evaluator: true
    eval_exclusive: 3
