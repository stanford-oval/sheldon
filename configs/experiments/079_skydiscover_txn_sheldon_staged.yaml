# exp078 in staged mode: sheldon hd-7 on txn_scheduling, each deciding stage
# its own call (no round conversation), toolloop on luna builds and evaluates.
# Everything else is exp078's, so the pair compares staged with session.
#
#   sheldon run -c configs/experiments/079_skydiscover_txn_sheldon_staged.yaml
#
# Score is 1e6 / (1 + makespan), higher is better, no wall-clock term; an
# evaluation can take minutes. References: EvoX 4310 (luna) and 4184 (terra),
# belief 4149.4 (exp051, makespan 240). Benchmark options follow exp051/054;
# `exploit_judge` is gone (an error now) and the completeness rule stands.
extends: ../default.yaml

benchmark: skydiscover
split: adrs
method: sheldon
engine: toolloop
model: gpt-5.6-terra

max_rounds: null
max_calls: null
max_usd: 10
concurrency: 1
tag: exp079
notes: >-
  txn_scheduling, sheldon hd-7 mode=staged: terra decides, toolloop (luna)
  builds and evaluates locally, 20 probe calls per local iteration. exp078's arm in
  staged mode; $10.

params:
  mode: staged
  rounds: 8
  n_initial: 5
  select_k: 5
  candidate_analysis_max_evals: 3
  candidate_analysis_min_gain_pct: 0.5
  candidate_analysis_patience: 2
  set_aside_cooldown: 3
  stagnation_rounds: 2
  candidate_analysis_concurrent: true
  candidate_analysis_probe_calls: 20
  probes: [run_shell]
  candidate_analysis_engine: toolloop
  candidate_analysis_engine_params:
    model: gpt-5.6-luna
  benchmark_opts:
    tasks: ADRS.txn_scheduling
    isolate: true
    runtime: host
    eval_exclusive: 3
